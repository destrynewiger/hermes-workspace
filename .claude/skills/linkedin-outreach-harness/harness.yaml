version: 1
updated: 2026-08-14
goal: >
  Coworker LinkedIn posts, connection requests, and messages are chosen,
  sent, and logged by agents that share this inventory. Humans attach a
  session once. Agents do not keep asking them to log in.

platforms:
  hermes:
    role: monitor-and-stage
    owns: [session_health, vault_writes, overnight_cadence]
  buzz:
    role: identity-router
    owns: [zaposio_allowlist, specialist_agents, chrome_profile_boundary]
  grokbot:
    role: remote-session-host
    owns: [virtual_linux_sessions, first_time_attach, passkey_persist]

principals:
  - id: rootly
    never_cross: [byteport, gradient]
  - id: byteport
    never_cross: [rootly, gradient]
  - id: gradient
    never_cross: [rootly, byteport]

identities:
  - id: john-gradient
    principal: gradient
    owner: john
    purpose: Book short product-feedback chats for the Gradient portfolio paging and incident-response platform. Not a Rootly sale.
    persona_ref: rootly-codex-brain/personas/john-gradient.json
    send_path: luey-runner
    send_mode: live
    session:
      host: luey
      status: unknown
      whoami: runner-whoami
    caps:
      connects_per_day: 15
      messages_per_day: 20
      spacing_minutes: [5, 15]
    ledger: luey-prospects

  - id: alex-rootly
    principal: rootly
    owner: alex
    purpose: Routing notes about who owns incident process. No product pitch on LinkedIn unless Alex asks.
    persona_ref: rootly-codex-brain/AGENTS.md
    send_path: ghostwrite-jj
    send_mode: draft_only
    session:
      host: alex-browser
      status: unknown
      whoami: opencli-profile-pin
    caps:
      connects_per_day: 0
      messages_per_day: 0
      spacing_minutes: [1440, 1440]
    ledger: rootly-queues

  - id: alex-byteport
    principal: byteport
    owner: alex
    purpose: Byteport GTM. Neutral data-movement positioning only.
    persona_ref: byteport-hermes/knowledge/prohibited-claims.md
    send_path: sequence-or-composio
    send_mode: staged
    session:
      host: alex-browser
      status: unknown
      whoami: opencli-profile-pin
    caps:
      connects_per_day: 10
      messages_per_day: 10
      spacing_minutes: [30, 120]
    ledger: attio

  - id: jayram-byteport
    principal: byteport
    owner: jayram
    purpose: Founder-voice outreach for Byteport.
    persona_ref: byteport-hermes/knowledge
    send_path: apollo-dripify
    send_mode: planned
    session:
      host: grokbot
      status: needs_attach
      whoami: grokbot-session-probe
    caps:
      connects_per_day: 10
      messages_per_day: 10
      spacing_minutes: [30, 120]
    ledger: attio

  - id: will-byteport
    principal: byteport
    owner: will
    purpose: Technical-peer LinkedIn for Byteport.
    persona_ref: byteport-hermes/knowledge
    send_path: dripify
    send_mode: planned
    session:
      host: grokbot
      status: needs_attach
      whoami: grokbot-session-probe
    caps:
      connects_per_day: 8
      messages_per_day: 8
      spacing_minutes: [45, 180]
    ledger: attio

  - id: laksh-byteport
    principal: byteport
    owner: laksh
    purpose: Founder-adjacent LinkedIn for Byteport.
    persona_ref: byteport-hermes/knowledge
    send_path: dripify
    send_mode: planned
    session:
      host: grokbot
      status: needs_attach
      whoami: grokbot-session-probe
    caps:
      connects_per_day: 8
      messages_per_day: 8
      spacing_minutes: [45, 180]
    ledger: attio

  - id: maggie-byteport
    principal: byteport
    owner: maggie
    purpose: Extra Byteport channel (hiring / founder-adjacent). Attach on GrokBot once.
    persona_ref: byteport-hermes/knowledge
    send_path: composio-or-grokbot
    send_mode: planned
    session:
      host: grokbot
      status: needs_attach
      whoami: grokbot-session-probe
    caps:
      connects_per_day: 8
      messages_per_day: 8
      spacing_minutes: [45, 180]
    ledger: attio

verification_devices:
  - id: maggie-device
    use: first-time-attach
    not_a_sender: true
  - id: scott-device
    use: first-time-attach
    not_a_sender: true

send_chain:
  - intent
  - identity
  - session
  - copy
  - cadence
  - stage
  - ledger

human_interrupts:
  - session_needs_login
  - session_locked
  - first_time_attach
  - same_person_assertion_failed
  - reputation_or_restriction_risk
